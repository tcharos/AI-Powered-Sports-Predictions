{% extends "layout.html" %}

{% block content %}
<style>
    /* Docs viewer styling — scoped to .docs-content so it doesn't bleed
       into the rest of the UI. Bootstrap handles the chrome; this just
       polishes the Markdown-rendered HTML in the content pane. */
    .docs-content {
        max-width: 920px;
        line-height: 1.65;
        font-size: 0.95rem;
    }
    .docs-content h1 {
        border-bottom: 2px solid var(--bs-border-color);
        padding-bottom: 0.4rem;
        margin-top: 0;
        margin-bottom: 1.2rem;
        font-size: 1.8rem;
    }
    .docs-content h2 {
        border-bottom: 1px solid var(--bs-border-color);
        padding-bottom: 0.3rem;
        margin-top: 2rem;
        margin-bottom: 0.8rem;
        font-size: 1.4rem;
    }
    .docs-content h3 {
        margin-top: 1.5rem;
        font-size: 1.15rem;
    }
    .docs-content table {
        width: 100%;
        margin: 1rem 0 1.4rem;
        border-collapse: collapse;
    }
    .docs-content table th,
    .docs-content table td {
        border: 1px solid var(--bs-border-color);
        padding: 0.4rem 0.6rem;
    }
    .docs-content table th {
        background: var(--bs-tertiary-bg);
        text-align: left;
        font-weight: 600;
    }
    .docs-content code {
        background: var(--bs-tertiary-bg);
        padding: 0.1rem 0.3rem;
        border-radius: 3px;
        font-size: 0.88em;
    }
    .docs-content pre {
        background: var(--bs-tertiary-bg);
        border: 1px solid var(--bs-border-color);
        border-radius: 4px;
        padding: 0.8rem 1rem;
        overflow-x: auto;
        font-size: 0.85rem;
    }
    .docs-content pre code {
        background: transparent;
        padding: 0;
    }
    .docs-content blockquote {
        border-left: 4px solid var(--bs-primary);
        padding-left: 1rem;
        color: var(--bs-secondary-color);
        margin: 1rem 0;
    }
    .docs-content ul,
    .docs-content ol {
        padding-left: 1.6rem;
    }
    .docs-content li {
        margin-bottom: 0.25rem;
    }
    .docs-content a {
        color: var(--bs-link-color);
    }
    /* Side nav highlight */
    .docs-side-nav .list-group-item.active {
        background-color: var(--bs-primary);
        border-color: var(--bs-primary);
    }
</style>

<div class="row g-3">
    <!-- Side navigation -->
    <div class="col-md-3">
        <div class="card sticky-top" style="top: 80px;">
            <div class="card-header bg-primary text-white">
                <strong>📚 Documentation</strong>
            </div>
            <div class="list-group list-group-flush docs-side-nav">
                {% for doc in side_nav %}
                <a href="{{ url_for('football.docs', name=doc.name) }}"
                   class="list-group-item list-group-item-action {{ 'active' if doc.current else '' }}">
                    {{ doc.icon }} {{ doc.title }}
                </a>
                {% endfor %}
            </div>
            <div class="card-footer small text-muted">
                Source: <code>docs/{{ current_name }}.md</code> — edit in
                Markdown, this page renders fresh on every load.
            </div>
        </div>
    </div>

    <!-- Rendered content -->
    <div class="col-md-9">
        <div class="card">
            <div class="card-body">
                <div class="docs-content">
                    {{ html_content|safe }}
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
